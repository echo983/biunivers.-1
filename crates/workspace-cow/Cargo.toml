[package]
name = "biunivers-workspace-cow"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fail-closed Upper scanner for Biunivers Workspace COW commits"
publish = false

[dependencies]
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
