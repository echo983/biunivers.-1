[package]
name = "biunivers-pvlogfs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Read-only fixed-HEAD PVLog filesystem for Biunivers Workspaces"
publish = false

[dependencies]
fuser = "=0.18.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[[bin]]
name = "biunivers-pvlogfs"
path = "src/main.rs"
