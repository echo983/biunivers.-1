[package]
name = "pvlog-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic PVLogS3Lite format and XXH3-128 core"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xxhash-rust = { version = "=0.8.18", features = ["xxh3"] }
unicode-normalization = "=0.1.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.126"

[dev-dependencies]
hex = "=0.4.3"
