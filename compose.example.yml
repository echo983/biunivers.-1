services:
  desktop:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      BIUNIVERS_DESKTOP_ORIGIN: ${BIUNIVERS_DESKTOP_ORIGIN:-http://localhost:8080}
      BIUNIVERS_APP_ORIGIN: ${BIUNIVERS_APP_ORIGIN:-http://localhost:8081}
    volumes:
      - biunivers-data:/data
      - ./apps.json:/app/dist/client/config/apps.json:ro
    restart: unless-stopped

volumes:
  biunivers-data:
