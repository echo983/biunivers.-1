name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install deployment verification dependency
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify Debian delivery assets
        run: |
          npm run test:debian-release
          npm run test:debian-installer
          npm run test:debian-updater
          npm run test:release-workflow

      - name: Verify PVLog core and vectors
        run: npm run test:pvlog

      - name: Build
        run: npm run build
