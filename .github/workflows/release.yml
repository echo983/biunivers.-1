name: Stable Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Publish immutable OCI images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      host_tag: ${{ steps.names.outputs.host_tag }}
      host_digest: ${{ steps.host.outputs.digest }}
      diagnostic_tag: ${{ steps.names.outputs.diagnostic_tag }}
      diagnostic_digest: ${{ steps.diagnostic.outputs.digest }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package_version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "$(git describe --tags --exact-match)" = "${GITHUB_REF_NAME}"

      - name: Resolve image names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "host_tag=ghcr.io/${owner}/biunivers:${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
          echo "diagnostic_tag=ghcr.io/${owner}/biunivers-runtime-diagnostic:${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish Host
        id: host
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.host_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Build and publish diagnostic executor
        id: diagnostic
        uses: docker/build-push-action@v6
        with:
          context: runtime/diagnostic
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.diagnostic_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true

  public-images:
    name: Verify anonymous image access
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Pull both immutable images without registry credentials
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "${{ needs.images.outputs.host_tag }}@${{ needs.images.outputs.host_digest }}"
          docker pull "${{ needs.images.outputs.diagnostic_tag }}@${{ needs.images.outputs.diagnostic_digest }}"

  runtime:
    name: Build Debian 12 Runtime asset
    needs: [images, public-images]
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Install Debian build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libfuse3-dev pkg-config zstd
          rm -rf /var/lib/apt/lists/*

      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build digest-pinned Runtime asset
        shell: bash
        env:
          BIUNIVERS_RELEASE_VERSION: ${{ github.ref_name }}
          BIUNIVERS_RELEASE_HOST_IMAGE: ${{ needs.images.outputs.host_tag }}
          BIUNIVERS_RELEASE_HOST_DIGEST: ${{ needs.images.outputs.host_digest }}
          BIUNIVERS_RELEASE_DIAGNOSTIC_IMAGE: ${{ needs.images.outputs.diagnostic_tag }}
          BIUNIVERS_RELEASE_DIAGNOSTIC_DIGEST: ${{ needs.images.outputs.diagnostic_digest }}
          BIUNIVERS_RELEASE_OUTPUT: ${{ github.workspace }}/release
        run: bash scripts/build-debian-release.sh

      - name: Add the fixed-tag installer and checksums
        shell: bash
        run: |
          set -euo pipefail
          installer="biunivers-install-${GITHUB_REF_NAME}.sh"
          install -m 0755 deploy/install.sh "release/${installer}"
          cd release
          sha256sum \
            "biunivers-runtime-${GITHUB_REF_NAME}-linux-x64.tar.zst" \
            "${installer}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload Release assets
        uses: actions/upload-artifact@v4
        with:
          name: biunivers-${{ github.ref_name }}-release
          path: |
            release/biunivers-runtime-${{ github.ref_name }}-linux-x64.tar.zst
            release/biunivers-install-${{ github.ref_name }}.sh
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub stable Release
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified assets
        uses: actions/download-artifact@v4
        with:
          name: biunivers-${{ github.ref_name }}-release
          path: release

      - name: Create stable Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              release/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Biunivers ${GITHUB_REF_NAME}" \
              --generate-notes \
              release/*
          fi
