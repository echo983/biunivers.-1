<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biunivers Notepad</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="actions">
          <button id="new" type="button">新建</button>
          <button id="open" type="button">打开</button>
          <button id="save" type="button">保存</button>
          <button id="save-as" type="button">另存为</button>
        </div>
        <strong id="filename">未命名.txt</strong>
      </header>
      <textarea
        id="editor"
        aria-label="文本内容"
        spellcheck="true"
        placeholder="在这里输入文本……"
      ></textarea>
      <footer>
        <span id="status" role="status">就绪</span>
        <span id="count">0 字符</span>
      </footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
